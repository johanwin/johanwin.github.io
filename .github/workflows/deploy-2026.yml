name: Publish 2026 site to gh-pages

# Builds 2026_site/ and pushes the result to the gh-pages branch — the same
# thing `npm run deploy` does locally. Runs when 2026_site changes on master,
# every Jan 1 at midnight Chicago time (year rollover),
# or on demand from the Actions tab ("Run workflow").
# Pages setting stays as-is: Source = "Deploy from a branch" → gh-pages / root.
on:
  push:
    branches: [master]
    paths: ['2026_site/**', '.github/workflows/deploy-2026.yml']
  workflow_dispatch:
  # New Year rebuild so year-based text (© year, "years active") rolls over.
  # 06:00 UTC on Jan 1 = midnight in Chicago (January is CST, UTC−6).
  # Note: GitHub disables scheduled workflows in public repos after 60 days
  # with no repo activity; the footer also updates its year in the browser,
  # so the © stays correct even if this run is skipped.
  schedule:
    - cron: '0 6 1 1 *'

permissions:
  contents: write   # push the build to gh-pages
  pages: write      # request the Pages rebuild below

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2026_site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Astro 7 needs Node >= 22.23.4; 24 is the current LTS line.
          node-version: 24
          cache: npm
          cache-dependency-path: 2026_site/package-lock.json
      - run: npm ci
      - run: npm run build
      # Replaces the site on gh-pages but keeps pr-preview/ (per-PR previews from
      # pr-preview.yml). Normal commits, no force-push (gh-pages is protected).
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: 2026_site/dist
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
          commit-message: Deploy 2026 site
      # A push made with GITHUB_TOKEN doesn't trigger other workflows, including
      # GitHub's own "pages build and deployment" — so without this the gh-pages
      # branch updates but the live site stays on the previous build.
      - name: Request GitHub Pages rebuild
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Wait for this commit's build to be live, then check key pages/files.
      # A failure turns the run red and GitHub emails you.
      - name: Smoke test the live site
        run: bash scripts/smoke-test.sh
        env:
          SITE_URL: https://johnnguyen.net
