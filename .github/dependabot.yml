# Dependabot: monthly, grouped update PRs so the site doesn't drift.
# Each PR runs the "PR checks" workflow (build + Lighthouse) before you merge.
# Merging them also counts as repo activity, which keeps the Jan 1 scheduled
# rebuild from being auto-disabled (GitHub disables schedules after 60 quiet days).
version: 2
updates:
  # npm packages for the live 2026 site.
  - package-ecosystem: npm
    directory: /2026_site
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps'
    ignore:
      # @astrojs/check (the type check in `npm run build`) only supports
      # TypeScript 5–6; TS 7 breaks `npm ci`. Remove once it supports 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      # Astro and its integrations move together.
      astro:
        patterns: ['astro', '@astrojs/*']
      # Everything else in one PR (React, Tailwind, Framer Motion, …).
      everything-else:
        patterns: ['*']

  # Archived sites (2017_site, 2024_site) are kept for reference only and are not
  # deployed: ignore everything there so Dependabot opens no version OR security
  # PRs for them. Security monitoring stays on for 2026_site above.
  - package-ecosystem: npm
    directory: /2017_site
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'
  - package-ecosystem: npm
    directory: /2024_site
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: '*'

  # Versions of the Actions used in .github/workflows (checkout, setup-node, …).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
